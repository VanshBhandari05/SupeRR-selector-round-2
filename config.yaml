# Single source of thresholds and rules. No magic numbers in code.
seed: 42

paths:
  data_dir: "."          # folder holding the supplied CSVs (relative to project root)
  out_dir: "outputs"

expected_ball_columns: 33
innings_balls: 120

# Competition tagging by id (not by name)
competition:
  ipl_comp_ids: [1358, 1715, 2193, 2725, 3298]
  ateam_comp_ids: [2670, 3289]
  full_member_team_ids: [17, 18, 19, 20, 21, 22, 23, 25, 27, 28, 72, 78]
  impact_rule_first_season: 2023     # IPL matches from this year onward

# extras1_runs is a type code, never runs
extras_codes: {1: noball, 2: wide, 3: legbye, 4: bye, 5: noball_other, 6: none, 7: penalty}
legal_codes: [3, 4, 6]
noball_codes: [1, 5]
wide_code: 2
penalty_code: 7
bye_codes: [3, 4]

# Rebuilding team runs
penalty_runs: 5
bye_nonrotating_runs: 4          # bye / leg-bye that did not rotate strike
bye_unknown_rotation_runs: 1     # rotation unknowable (final ball of innings, or wicket ball)
batting_position_clip: 11
position_bands: {low: [1, 3], mid: [4, 7], high: [8, 11]}

env_tier:
  pseudo_balls: 1200             # shrinkage weight toward group-season scoring rate
  n_tiers: 3

# Result parsing: ordered rules, first match wins (see src/stage0_1.py)
rain_regex: "d/l|dls"
tie_regex: "super over|tied|eliminator"
noresult_regex: "no result|abandon"

# Gates (stop and report on failure; never loosen to pass)
gates:
  expected_wins_by_runs: 414
  expected_wins_by_wickets: 419
  expected_ties: 10
  expected_no_results: 40
  expected_rain_matches: 38
  must_flag_truncated_match: 18532
  strike_rule_min_agreement: 0.995
  wickets_gate_named_exceptions: [20190]
  margin_median_abs_max: 1
  margin_p95_abs_max: 6
  margin_outlier_runs: 8
  expected_truncated_matches: [14130, 14164, 15795, 18532, 31278, 48514, 50407]
  expected_rating_sample: {IPL: 353, T20I: 375, ties: 7}
  overshoot_diag_runs: 5          # diagnostic only, not a gate (withdrawn)

# External totals check (public scorecards, validation only). Thresholds set before any result.
external_check:
  n_matches: 15
  seed: 42
  totals_file: "data_external/external_totals.csv"   # match_id, public_total_inn1, public_total_inn2, source
  mean_error_min: -3
  mean_error_max: 1
  within_runs: 5
  min_within: 27                 # of 2 * n_matches totals

# ---------------- Stage 2a / 2b: scoring model and win probability ----------------
scoring_model:
  over_band_starts: [1, 2, 4, 7, 10, 13, 16, 18, 19, 20]   # 10 over bands
  wicket_band_max: 7                                        # wickets lost 0..6, 7+
  rr_band_edges: [6, 8, 10, 12, 15]                         # innings 2: 6 required-rate bands
  C_grid: [0.03, 0.1, 0.3, 1.0, 3.0]                        # inverse L2 strength; chosen per innings by LOSO next-ball log loss
  max_iter: 500
  n_pad: 15                                                 # runs-required table size above the largest observed
  x_max: 400                                                # runs-to-come support
  use_env_tier: true               # kept: without it the innings-1 decile gate fails (CHANGES_FOR_REVIEW #4)
  C_fixed: 0.1                     # lowest-log-loss C that passes all gates with env_tier (CHANGES_FOR_REVIEW #5); null = choose by LOSO log loss
  monotone_projection: true        # used only if held-out Brier worsens by no more than the next line
  projection_max_brier_loss: 0.0005
  # legal-ball outcome classes: W, 0, 1, 2, 3, 4, 6 ; illegal-ball classes: 1, 2, 3+ (valued at their mean)
calibration:
  wp_clip: 0.0001
  min_cell_balls: 500
  cell_tolerance: 0.01          # fitted vs observed outcome frequency, 1 percentage point
  decile_tolerance: 0.05        # predicted vs observed win rate in every decile bin
  bootstrap_n: 200


# ---------------- Stage 2c: leverage and pressure ----------------
pressure:
  live_low: 0.02
  live_high: 0.98
  pressure_quantile: 0.80       # top 20% of live balls, pooled across innings


# ---------------- Stage 3: proving the pressure definition ----------------
stage3:
  phase_bounds: [6, 15]                 # powerplay overs 1-6, middle 7-15, death 16-20
  wicket_bands: [2, 5]                  # wickets lost 0-2, 3-5, 6+
  min_cell_balls: 30
  bootstrap_n: 300
  heatmap_min_balls: 20
  close_runs: 10
  close_wickets: 3
  attacking_strokes: ["Slog", "Slog Sweep", "Paddle Scoop", "Reverse Paddle Scoop"]
  defensive_strokes: ["Frontfoot defensive", "Backfoot defensive", "Defense", "Intentional Padding"]
  yorker_styles: ["Yorker", "Wide Yorker"]
  slower_styles: ["Slow Ball", "Slow Bouncer", "Knuckle", "Back of Hand"]
  lemmer_wicket_weights: [1.30, 1.35, 1.40, 1.45, 1.38, 1.18, 0.98, 0.79, 0.59, 0.39, 0.19]   # Lemmer (2015), by batting position

# ---------------- Stage 4 / 5: ratings and fair comparison (locked before any leaderboard is viewed) ----------------
rating:
  lambda_B_grid: [30, 100, 300, 1000, 3000, 10000]
  lambda_C_grid: [300, 1000, 3000, 10000, 30000, 100000]
  context_lambda: 0.001
  cv_folds: 5
  eligibility:
    min_pressure_balls: 120
    min_matches: 15
    fallback_min_players: 40        # if fewer qualify in a role, drop to the next two numbers
    fallback_pressure_balls: 90
    fallback_matches: 12
  active_years: [2025, 2026]
  gate_batter_rho_min: 0.5
  gate_bowler_rho_max: -0.4
  bootstrap_n: 300
  floor_quantile: 0.10
  negative_shift_quantile: 0.90     # drop a player whose shift's 90th percentile is below zero
  top_n: 10

# ---------------- Stage 6: reliability ----------------
stage6:
  split_half_n: 200
  half_min_pressure_balls: 60        # half of the eligibility threshold
  half_min_matches: 7
  season_split_year: 2024            # fit on <= 2024, score 2025-2026
  permutations: 500
  perm_min_pressure_rows: 30         # players need this many pressure and ordinary rows for the raw-shift spread

# ---------------- Stage 6b: sensitivity grid ----------------
sensitivity:
  cutoffs: [0.10, 0.15, 0.25, 0.30]
  recency_half_life_years: 2
  winsor_quantiles: [0.01, 0.99]   # sensitivity variant only: ball values capped at these percentiles
